    <script>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-24 transition-colors duration-200">

    <!-- Header App Bar -->
    <header class="bg-emerald-600 dark:bg-emerald-800 text-white p-3.5 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5">
                <a href="index.html" class="p-2 rounded-xl bg-emerald-700 dark:bg-emerald-900 hover:bg-emerald-800 border border-emerald-500/60 transition-all flex items-center justify-center text-white active:scale-95 shadow-sm" title="Kembali ke Beranda">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <div>
                    <h1 class="text-base font-extrabold leading-tight">Kebutuhan Muslim</h1>
                    <p class="text-[10px] text-emerald-100/90 font-medium">Penunjang Ibadah Harian</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="theme-btn" onclick="ThemeManager.toggle()" title="Ganti Mode"
                    class="bg-emerald-700 dark:bg-emerald-900 hover:bg-emerald-800 active:scale-95 px-2.5 py-1.5 rounded-xl border border-emerald-400/60 transition-all flex items-center text-white">
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 max-w-md mx-auto w-full gap-4">

        <!-- Search Bar -->
        <div class="relative w-full">
            <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Cari sajadah, Al-Qur'an, tasbih..."
                class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 pl-10 pr-4 text-xs font-medium text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all shadow-xs">
            <span class="absolute left-3.5 top-3 text-slate-400 dark:text-slate-500 text-sm">🔍</span>
        </div>

        <!-- Filter Kategori Horizontal Scroll -->
        <div class="flex gap-2 w-full overflow-x-auto pb-1 scrollbar-none text-xs">
            <button onclick="filterCategory('semua')" class="category-btn bg-emerald-600 dark:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 shadow-xs">
                Semua
            </button>
            <button onclick="filterCategory('ibadah')" class="category-btn bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 hover:border-emerald-500">
                🕋 Perlengkapan
            </button>
            <button onclick="filterCategory('buku')" class="category-btn bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 hover:border-emerald-500">
                📚 Buku & Qur'an
            </button>
            <button onclick="filterCategory('wewangian')" class="category-btn bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 hover:border-emerald-500">
                🌿 Minyak Wangi
            </button>
        </div>

        <!-- Grid Produk -->
        <div id="products-grid" class="grid grid-cols-2 gap-3 w-full">
            <!-- Render via JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center w-full">
            <span class="text-4xl mb-2">🔍</span>
            <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200">Produk Tidak Ditemukan</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Coba gunakan kata kunci pencarian yang lain.</p>
        </div>

    </main>

    <footer class="p-6 text-center text-slate-400 dark:text-slate-500 text-xs">
        <p class="font-medium">Aplikasi Dzikir Digital Pocket Book</p>
        <p class="mt-1 opacity-60 italic">Berdasarkan Al-Qur'an dan Sunnah Rasulullah ﷺ</p>
        <p class="mt-3 text-[10px] tracking-wide opacity-50">© 2026 Dzikir. By Abu Ayumi.</p>
    </footer>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 fixed bottom-0 left-0 right-0 z-20 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around items-center py-2">
            <a href="index.html" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all font-medium py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-[10px] mt-1">Beranda</span>
            </a>
            <a href="shop.html"
                class="flex flex-col items-center text-emerald-600 dark:text-emerald-400 font-semibold py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span class="text-[10px] mt-1">Kebutuhan</span>
            </a>
        </div>
    </nav>

    <script src="products.js"></script>
    <script>
        let currentCategory = 'semua';

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            list.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-xs flex flex-col justify-between hover:border-emerald-500 transition-all";
                card.innerHTML = `
                    <div>
                        <div class="w-full h-32 bg-slate-100 dark:bg-slate-800 rounded-xl mb-2.5 flex items-center justify-center text-4xl overflow-hidden">
                            ${p.image ? `<img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover rounded-xl" />` : p.icon}
                        </div>
                        <span class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">${p.category}</span>
                        <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100 mt-0.5 line-clamp-2">${p.title}</h3>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${p.desc}</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                        <span class="text-xs font-extrabold text-emerald-700 dark:text-emerald-400">${p.price}</span>
                        <a href="${p.link}" target="_blank" class="bg-emerald-600 dark:bg-emerald-700 hover:bg-emerald-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg transition-all active:scale-95">
                            Beli ↗
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 hover:border-emerald-500";
            });
            event.target.className = "category-btn bg-emerald-600 dark:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl transition-all whitespace-nowrap active:scale-95 shadow-xs";

            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = productsData;

            if (currentCategory !== 'semua') {
                filtered = filtered.filter(p => p.categoryKey === currentCategory);
            }

            if (query.trim() !== '') {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            }

            renderProducts(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof productsData !== 'undefined') {
                renderProducts(productsData);
            }
        });
    </script>
</body>

</html>
