<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebutuhan Muslim - Dzikir App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-232W7YF5TT"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* == THEME VARIABLES == */
        :root {
            --bg-base: #F7F3EC;
            --bg-card: #FFFFFF;
            --bg-elevated: #EDE9E0;
            --text-primary: #1E1A16;
            --text-secondary: #4A3F35;
            --text-muted: #8B7D72;
            --border: #DDD5C8;
            --nav-bg: #FFFCF7;
            --nav-border: #E8E0D5;
            --accord-bg: #EDE9E0;
            --input-bg: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-base: #18160F;
            --bg-card: #242018;
            --bg-elevated: #2C2820;
            --text-primary: #EDE5D5;
            --text-secondary: #C0AE9A;
            --text-muted: #7A6B5E;
            --border: #38332A;
            --nav-bg: #1E1C15;
            --nav-border: #2E2A22;
            --accord-bg: #2C2820;
            --input-bg: #2C2820;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-base) !important;
            transition: background-color 0.25s ease;
        }

        [data-theme="dark"] header.bg-emerald-600 {
            background-color: #064E3B !important;
        }

        /* Search */
        #search-input {
            background-color: var(--input-bg) !important;
            border-color: var(--border) !important;
            color: var(--text-primary) !important;
        }

        #search-input::placeholder {
            color: var(--text-muted) !important;
        }

        .relative>span.text-slate-400 {
            color: var(--text-muted) !important;
        }

        /* Category buttons (inactive) */
        .category-btn:not(.bg-emerald-600) {
            background-color: var(--accord-bg) !important;
            color: var(--text-secondary) !important;
            border-color: var(--border) !important;
        }

        /* Product cards */
        #products-grid>div {
            background-color: var(--bg-card) !important;
            border-color: var(--border) !important;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        #products-grid h3 {
            color: var(--text-primary) !important;
        }

        #products-grid p {
            color: var(--text-muted) !important;
        }

        #products-grid .bg-slate-100 {
            background-color: var(--bg-elevated) !important;
        }

        /* Empty state */
        #empty-state h3 {
            color: var(--text-primary) !important;
        }

        #empty-state p {
            color: var(--text-muted) !important;
        }

        /* Nav */
        nav {
            background-color: var(--nav-bg) !important;
            border-color: var(--nav-border) !important;
            transition: background-color 0.25s ease;
        }

        nav a.text-slate-400 {
            color: var(--text-muted) !important;
        }

        [data-theme="dark"] nav a.text-emerald-600 {
            color: #34D399 !important;
        }

        /* Footer */
        footer p {
            color: var(--text-muted) !important;
        }

        [data-theme="dark"] footer .text-emerald-400 {
            color: #6EE7B7 !important;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col pb-20">

    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html"
                    class="bg-emerald-700 hover:bg-emerald-800 active:scale-95 p-1.5 rounded-full border border-emerald-400 transition-all flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <h1 class="text-xl font-bold">Kebutuhan Muslim</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="theme-btn" onclick="ThemeManager.toggle()" title="Ganti Mode"
                    class="bg-emerald-700 hover:bg-emerald-800 active:scale-95 px-2 py-1.5 rounded-xl border border-emerald-400 transition-all flex items-center text-white">
                </button>
                <button onclick="refreshPage()" id="refresh-btn"
                    class="bg-emerald-700 hover:bg-emerald-800 active:scale-95 px-2 py-1.5 rounded-xl border border-emerald-400 transition-all flex items-center">
                    <svg id="refresh-icon" class="w-3.5 h-3.5 transition-transform duration-500" fill="none"
                        stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col gap-4">

        <!-- Tombol Install PWA -->
        <div id="install-container" class="hidden w-full">
            <button onclick="installPWA()"
                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
                📲 Pasang Aplikasi di HP
            </button>
        </div>

        <!-- Kolom Pencarian -->
        <div class="w-full">
            <div class="relative flex items-center">
                <span class="absolute left-3 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="search-input" oninput="filterProducts()"
                    placeholder="Temukan kebutuhan penunjang ibadahmu..."
                    class="w-full bg-white border border-slate-200 pl-10 pr-4 py-2.5 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-slate-700 text-sm transition-all">
            </div>
        </div>

        <!-- Filter Kategori -->
        <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
            <button onclick="selectCategory('Semua')" id="cat-Semua"
                class="category-btn bg-emerald-600 text-white font-medium text-xs py-2 px-4 rounded-xl border border-emerald-600 shadow-sm transition-all whitespace-nowrap">
                Semua
            </button>
            <button onclick="selectCategory('Buku')" id="cat-Buku"
                class="category-btn bg-white text-slate-600 font-medium text-xs py-2 px-4 rounded-xl border border-slate-200 transition-all whitespace-nowrap hover:bg-slate-50">
                Buku
            </button>
            <button onclick="selectCategory('Aksesoris')" id="cat-Aksesoris"
                class="category-btn bg-white text-slate-600 font-medium text-xs py-2 px-4 rounded-xl border border-slate-200 transition-all whitespace-nowrap hover:bg-slate-50">
                Aksesoris
            </button>
            <button onclick="selectCategory('Herbal')" id="cat-Herbal"
                class="category-btn bg-white text-slate-600 font-medium text-xs py-2 px-4 rounded-xl border border-slate-200 transition-all whitespace-nowrap hover:bg-slate-50">
                Herbal
            </button>
        </div>

        <!-- Container Grid Produk -->
        <div id="products-grid" class="grid grid-cols-2 gap-4 mt-2">
            <!-- Produk akan dimuat secara dinamis dengan JS -->
        </div>

        <!-- Tampilan Jika Produk Tidak Ditemukan -->
        <div id="empty-state" class="hidden text-center py-10 flex flex-col items-center justify-center gap-2">
            <span class="text-4xl">🔍</span>
            <h3 class="text-slate-700 font-bold text-base mt-2">Produk Tidak Ditemukan</h3>
            <p class="text-slate-400 text-xs px-6">Coba cari dengan kata kunci lain atau pilih kategori yang berbeda.
            </p>
        </div>

    </main>

    <footer class="text-center py-4 pb-24">
        <p class="text-slate-300 text-[10px] tracking-wide">© 2026 Dzikir Harian. By Abu Ayumi.</p>
    </footer>

    <!-- Bottom Navigation Bar untuk PWA -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-20 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around items-center py-2">
            <a href="index.html"
                class="flex flex-col items-center text-slate-400 hover:text-emerald-600 transition-all font-medium py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span class="text-[10px] mt-1">Dzikir</span>
            </a>
            <a href="shop.html" class="flex flex-col items-center text-emerald-600 font-semibold py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span class="text-[10px] mt-1">Kebutuhan</span>
            </a>
        </div>
    </nav>

    <script src="products.js"></script>
    <script>
        // --- FITUR PWA INSTALL ---
        let deferredPrompt;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-container').classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const {
                outcome
            } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('install-container').classList.add('hidden');
            deferredPrompt = null;
        }

        function refreshPage() {
            const icon = document.getElementById('refresh-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => window.location.reload(true), 400);
        }
    </script>
    <script>
        let activeCategory = 'Semua';

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            products.forEach(product => {
                const card = document.createElement('div');
                card.className =
                    "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow duration-300";
                card.innerHTML = `
          <div>
            <div class="h-32 w-full overflow-hidden bg-slate-100 relative">
              <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 bg-emerald-500 text-white text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full shadow-sm">
                ${product.category}
              </span>
            </div>
            <div class="p-3">
              <h3 class="font-semibold text-slate-800 text-xs line-clamp-1">${product.name}</h3>
              <p class="text-[10px] text-slate-400 mt-1 line-clamp-2">${product.description}</p>
            </div>
          </div>
          <div class="px-3 pb-3">
            <a href="${product.shopeeUrl}" target="_blank"
              class="w-full bg-[#EE4D2D] hover:bg-[#e03d1e] text-white font-medium text-[11px] py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-all shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              Beli di Shopee
            </a>
          </div>
        `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            const filtered = productsData.filter(product => {
                const matchesCategory = (activeCategory === 'Semua' || product.category === activeCategory);
                const matchesSearch = product.name.toLowerCase().includes(searchQuery) ||
                    product.description.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            renderProducts(filtered);
        }

        function selectCategory(category) {
            activeCategory = category;

            // Update button styles
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if (btn.id === `cat-${category}`) {
                    btn.className =
                        "category-btn bg-emerald-600 text-white font-medium text-xs py-2 px-4 rounded-xl border border-emerald-600 shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className =
                        "category-btn bg-white text-slate-600 font-medium text-xs py-2 px-4 rounded-xl border border-slate-200 transition-all whitespace-nowrap hover:bg-slate-50";
                }
            });

            filterProducts();
        }

        // Load initial products list
        renderProducts(productsData);
    </script>
</body>

</html>
