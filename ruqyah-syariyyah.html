    <footer class="p-6 text-center text-slate-400 dark:text-slate-500 text-xs">

    <script>
        // Data Fallback Ruqyah Syari'yyah
        const fallbackRuqyah = [
            {
                id: 1,
                judul: "1. Surah Al-Fatihah (Pembuka & Penawar Utama)",
                arab: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",
                arti: "Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang. Segala puji bagi Allah, Tuhan semesta alam...",
                ulang: 3
            },
            {
                id: 2,
                judul: "2. Ayat Kursi (Benteng Utama Perlindungan)",
                arab: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
                arti: "Allah, tidak ada tuhan selain Dia. Yang Mahahidup, yang terus-menerus mengurus (makhluk-Nya), tidak mengantuk dan tidak tidur...",
                ulang: 3
            },
            {
                id: 3,
                judul: "3. Surah Al-Ikhlas (Kemurnian Tauhid)",
                arab: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",
                arti: "Katakanlah (Muhammad), Dialah Allah, Yang Maha Esa. Allah tempat meminta segala sesuatu. Allah tidak beranak dan tidak pula diperanakkan...",
                ulang: 3
            },
            {
                id: 4,
                judul: "4. Surah Al-Falaq (Perlindungan dari Kejahatan Makhluk & Hasad)",
                arab: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
                arti: "Katakanlah, Aku berlindung kepada Tuhan yang menguasai subuh (fajar), dari kejahatan makhluk yang Dia ciptakan...",
                ulang: 3
            },
            {
                id: 5,
                judul: "5. Surah An-Nas (Perlindungan dari Bisikan Syetan & Manusia)",
                arab: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",
                arti: "Katakanlah, Aku berlindung kepada Tuhannya manusia, Raja manusia, Sembahan manusia, dari kejahatan (bisikan) setan yang bersembunyi...",
                ulang: 3
            },
            {
                id: 6,
                judul: "6. Doa Perlindungan dari Kalimat Allah yang Sempurna",
                arab: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
                arti: "Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan makhluk yang Dia ciptakan.",
                ulang: 3
            },
            {
                id: 7,
                judul: "7. Doa Penyembuh Penyakit & Hilang Rasa Sakit",
                arab: "اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ اشْفِ أَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ شِفَاءً لاَ يُغَادِرُ سَقَمًا",
                arti: "Ya Allah, Tuhan manusia, hilangkanlah penyakit ini. Sembuhkanlah, Engkaulah Yang Maha Menyembuhkan, tidak ada kesembuhan selain kesembuhan-Mu, kesembuhan yang tidak meninggalkan rasa sakit.",
                ulang: 3
            },
            {
                id: 8,
                judul: "8. Doa Ruqyah Jibril untuk Nabi ﷺ",
                arab: "بِسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ اللَّهُ يَشْفِيكَ بِسْمِ اللَّهِ أَرْقِيكَ",
                arti: "Dengan nama Allah aku meruqyahmu dari segala sesuatu yang menyakitimu, dari kejahatan setiap jiwa atau pandangan mata yang dengki. Semoga Allah menyembuhkanmu, dengan nama Allah aku meruqyahmu.",
                ulang: 3
            }
        ];

        let listRuqyah = [];
        let currentIndex = 0;
        let currentCount = 0;
        let deferredPrompt;

        async function loadRuqyahData() {
            try {
                const response = await fetch('https://ruqyah-syariyyah.api.kodelabo.com/');
                if (response.ok) {
                    const json = await response.json();
                    listRuqyah = normalizeRuqyahItems(json);
                } else {
                    listRuqyah = fallbackRuqyah;
                }
            } catch (err) {
                console.warn("Menggunakan data lokal Ruqyah Syari'yyah:", err);
                listRuqyah = fallbackRuqyah;
            }

            if (!listRuqyah || listRuqyah.length === 0) listRuqyah = fallbackRuqyah;
            updateUI();
        }

        function normalizeRuqyahItems(data) {
            if (Array.isArray(data)) return data;
            if (data && Array.isArray(data.data)) return data.data;
            if (data && Array.isArray(data.ruqyah)) return data.ruqyah;
            return fallbackRuqyah;
        }

        function updateUI() {
            if (!listRuqyah || listRuqyah.length === 0) return;

            const item = listRuqyah[currentIndex];
            document.getElementById('judul-dzikir').innerText = item.judul || `Ruqyah #${currentIndex + 1}`;
            document.getElementById('arabic-text').innerText = item.arab || item.arabic || "";
            document.getElementById('translation-text').innerText = item.arti || item.terjemahan || item.translation || "";

            const target = item.ulang || item.count || 1;
            if (currentCount === 0) currentCount = target;

            document.getElementById('counter-number').innerText = currentCount;
            document.getElementById('counter-target').innerText = "Target: " + target + "x";

            updateRing(currentCount, target);

            // Progress bar halaman
            const progressPercent = ((currentIndex + 1) / listRuqyah.length) * 100;
            document.getElementById('progress-indicator').style.width = progressPercent + "%";
        }

        function updateRing(c, t) {
            const ring = document.getElementById('counter-ring');
            ring.style.strokeDashoffset = 364.4 - (c / t) * 364.4;
        }

        function decrementCounter() {
            if (currentCount > 0) {
                currentCount--;
                if ("vibrate" in navigator) navigator.vibrate(50);

                if (currentCount === 0) {
                    setTimeout(nextDzikir, 300);
                }
            }
            updateUI();
        }

        function nextDzikir() {
            if (currentIndex < listRuqyah.length - 1) {
                currentIndex++;
                currentCount = 0;
                updateUI();
                window.scrollTo(0, 0);
            } else {
                if (window.TrackerManager) TrackerManager.markComplete('ruqyah');
                alert("Alhamdulillah, amalan ruqyah syari'yyah selesai!");
                currentIndex = 0;
                currentCount = 0;
                updateUI();
            }
        }

        function prevDzikir() {
            if (currentIndex > 0) {
                currentIndex--;
                currentCount = 0;
                updateUI();
            }
        }

        function refreshPage() {
            const icon = document.getElementById('refresh-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => window.location.reload(true), 400);
        }

        let isTranslationOpen = false;

        function toggleTranslation() {
            isTranslationOpen = !isTranslationOpen;
            const container = document.getElementById('translation-container');
            const icon = document.getElementById('accordion-icon');

            if (isTranslationOpen) {
                container.style.maxHeight = container.scrollHeight + "px";
                container.style.opacity = "1";
                icon.classList.add('rotate-180');
            } else {
                container.style.maxHeight = "0px";
                container.style.opacity = "0";
                icon.classList.remove('rotate-180');
            }
        }

        function shareCurrentDzikirItem() {
            if (!listRuqyah || !listRuqyah[currentIndex]) return;
            const item = listRuqyah[currentIndex];

            const message = `🛡️ *${item.judul} (Ruqyah Syari'yyah)*\n\n${item.arab}\n\n"${item.arti}"\n\n_Dibagikan dari Aplikasi Dzikir_\nhttps://dzikir-pagi-petang.kodelabo.com/`;

            if (navigator.share) {
                navigator.share({
                    title: item.judul,
                    text: message,
                    url: 'https://dzikir-pagi-petang.kodelabo.com/'
                }).catch(() => {});
            } else {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
                window.open(waUrl, '_blank');
            }
        }

        // Mulai Ambil Data
        loadRuqyahData();
    </script>
</body>

</html>
