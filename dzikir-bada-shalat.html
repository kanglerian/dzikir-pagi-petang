<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-20 transition-colors duration-200">

        <!-- Font Size Control -->

            <div class="flex gap-1.5 text-xs font-bold">
                <button id="font-sm" onclick="ThemeManager.setFont('sm')" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all">A-</button>

                <button id="font-lg" onclick="ThemeManager.setFont('lg')" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all">A+</button>
            </div>

        <!-- Main Card Dzikir -->
        <div id="dzikir-card" onclick="decrementCounter()"

            <h2 id="judul-dzikir" class="text-emerald-600 dark:text-emerald-400 font-bold text-xs uppercase tracking-wide"></h2>

            <!-- Accordion Terjemahan & Share -->
            <div class="border-t border-slate-100 dark:border-slate-800 pt-4 flex gap-2 items-center" onclick="event.stopPropagation()">
                <button onclick="toggleTranslation()"
                    class="flex-grow flex justify-between items-center bg-slate-50 dark:bg-slate-800/60 hover:bg-emerald-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700/60">
                    <span>Tampilkan Terjemahan</span>
                    <svg id="accordion-icon" class="w-4 h-4 transform transition-transform duration-300 text-slate-400"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <button onclick="shareCurrentDzikirItem()" title="Bagikan ke WhatsApp"
                    class="bg-slate-50 dark:bg-slate-800/60 hover:bg-emerald-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/60 text-xs flex items-center justify-center transition-all active:scale-95">
                    📲
                </button>
            </div>

            <div id="translation-container"
                class="mt-1 text-slate-600 dark:text-slate-300 text-xs leading-relaxed overflow-hidden transition-all duration-300 max-h-0 opacity-0">
                <p id="translation-text" class="pt-1 px-1"></p>
            </div>

            <!-- Tasbih Digital Circular Ring Counter -->
            <div class="flex justify-center items-center mt-2">
                <div class="relative w-36 h-36 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 128 128">
                        <circle cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent"
                            class="text-slate-100 dark:text-slate-800" />
                        <circle id="counter-ring" cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8"
                            fill="transparent" stroke-dasharray="364.4" stroke-dashoffset="0" stroke-linecap="round"
                            class="text-emerald-500 dark:text-emerald-400 transition-all duration-200" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <span id="counter-number" class="text-4xl font-extrabold text-slate-900 dark:text-slate-100">0</span>
                        <span id="counter-target" class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Dibaca 1x</span>
                    </div>
                </div>
            </div>

            <p class="text-center text-[10px] text-slate-400 dark:text-slate-500 font-medium">Ketuk area mana saja untuk menghitung</p>
        </div>

        <!-- Controller Navigation -->
        <div class="flex justify-between items-center w-full mt-4 gap-3">
            <button onclick="prevDzikir()"
                class="flex-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3.5 px-4 rounded-xl text-xs active:scale-95 transition-all text-center">
                ← Sebelumnya
            </button>
            <button onclick="nextDzikir()"
                class="flex-1 bg-emerald-600 dark:bg-emerald-700 hover:bg-emerald-700 dark:hover:bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-xl text-xs shadow-md active:scale-95 transition-all text-center">
                Selanjutnya →
            </button>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-400 dark:text-slate-500 text-xs">
        <p class="font-medium">Aplikasi Dzikir Digital Pocket Book</p>
        <p class="mt-1 opacity-60 italic">Berdasarkan Al-Qur'an dan Sunnah Rasulullah ﷺ</p>
        <p class="mt-3 text-[10px] tracking-wide opacity-50">© 2026 Dzikir. By Abu Ayumi.</p>
    </footer>

    <script>
        // Fallback Data Dzikir Ba'da Shalat Fardhu
        const fallbackBadaShalat = [
            {
                id: 1,
                judul: "1. Istighfar & Memohon Keselamatan",
                arab: "أَسْتَغْفِرُ اللهَ (٣x) اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ",
                arti: "Aku memohon ampunan kepada Allah (3x). Ya Allah, Engkau Mahasejahtera dan dari-Mu lah kesejahteraan. Mahasuci Engkau, wahai Rabb Pemilik Keagungan dan Kemuliaan.",
                ulang: 3
            },
            {
                id: 2,
                judul: "2. Tauhid & Pengakuan Kuasa Allah",
                arab: "لاَ إِلَهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
                arti: "Tiada ilah yang berhak disembah selain Allah Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan pujian, dan Dia Mahakuasa atas segala sesuatu. Ya Allah, tidak ada yang dapat menghalangi apa yang Engkau berikan, dan tidak ada yang dapat memberi apa yang Engkau halangi.",
                ulang: 1
            },
            {
                id: 3,
                judul: "3. Tasbih (Maha Suci Allah)",
                arab: "سُبْحَانَ اللهِ",
                arti: "Maha Suci Allah.",
                ulang: 33
            },
            {
                id: 4,
                judul: "4. Tahmid (Segala Puji Bagi Allah)",
                arab: "الْحَمْدُ لِلَّهِ",
                arti: "Segala puji bagi Allah.",
                ulang: 33
            },
            {
                id: 5,
                judul: "5. Takbir (Allah Maha Besar)",
                arab: "اللهُ أَكْبَرُ",
                arti: "Allah Maha Besar.",
                ulang: 33
            },
            {
                id: 6,
                judul: "6. Penutup Tasbih (Tauhid Sempurna)",
                arab: "لاَ إِلَهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
                arti: "Tiada ilah yang berhak disembah selain Allah Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya segala puji dan Dia Mahakuasa atas segala sesuatu.",
                ulang: 1
            },
            {
                id: 7,
                judul: "7. Ayat Kursi (Pengagungan Allah)",
                arab: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ",
                arti: "Allah, tidak ada tuhan selain Dia. Yang Mahahidup, yang terus-menerus mengurus (makhluk-Nya), tidak mengantuk dan tidak tidur. Milik-Nya apa yang ada di langit dan apa yang ada di bumi.",
                ulang: 1
            }
        ];

        let listBadaShalat = [];
        let currentIndex = 0;
        let currentCount = 0;
        let deferredPrompt;

        async function loadBadaShalatData() {
            try {
                const response = await fetch('https://dzikir-bada-shalat.api.kodelabo.com/');
                if (response.ok) {
                    const json = await response.json();
                    listBadaShalat = normalizeItems(json);
                } else {
                    listBadaShalat = fallbackBadaShalat;
                }
            } catch (err) {
                console.warn("Menggunakan data lokal dzikir ba'da shalat:", err);
                listBadaShalat = fallbackBadaShalat;
            }
            if (!listBadaShalat || listBadaShalat.length === 0) listBadaShalat = fallbackBadaShalat;
            updateUI();
        }

        function normalizeItems(data) {
            if (Array.isArray(data)) return data;
            if (data && Array.isArray(data.data)) return data.data;
            if (data && Array.isArray(data.dzikir)) return data.dzikir;
            return fallbackBadaShalat;
        }

        function updateUI() {
            if (!listBadaShalat || listBadaShalat.length === 0) return;

            const item = listBadaShalat[currentIndex];
            document.getElementById('judul-dzikir').innerText = item.judul || `Dzikir Ba'da Shalat #${currentIndex + 1}`;
            document.getElementById('arabic-text').innerText = item.arab || item.arabic || "";
            document.getElementById('translation-text').innerText = item.arti || item.terjemahan || item.translation || "";

            const target = item.ulang || item.count || 1;
            if (currentCount === 0) currentCount = target;

            document.getElementById('counter-number').innerText = currentCount;
            document.getElementById('counter-target').innerText = "Target: " + target + "x";

            updateRing(currentCount, target);

            // Progress bar halaman
            const progressPercent = ((currentIndex + 1) / listBadaShalat.length) * 100;
            document.getElementById('progress-indicator').style.width = progressPercent + "%";
        }

        function updateRing(c, t) {
            const ring = document.getElementById('counter-ring');
            ring.style.strokeDashoffset = 364.4 - (c / t) * 364.4;
        }

        function decrementCounter() {
            if (currentCount > 0) {
                currentCount--;
                if ("vibrate" in navigator) navigator.vibrate(50);

                if (currentCount === 0) {
                    setTimeout(nextDzikir, 300);
                }
            }
            updateUI();
        }

        function nextDzikir() {
            if (currentIndex < listBadaShalat.length - 1) {
                currentIndex++;
                currentCount = 0;
                updateUI();
                window.scrollTo(0, 0);
            } else {
                if (window.TrackerManager) TrackerManager.markComplete('bada_shalat');
                alert("Alhamdulillah, dzikir ba'da shalat selesai!");
                currentIndex = 0;
                currentCount = 0;
                updateUI();
            }
        }

        function prevDzikir() {
            if (currentIndex > 0) {
                currentIndex--;
                currentCount = 0;
                updateUI();
            }
        }

        function refreshPage() {
            const icon = document.getElementById('refresh-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => window.location.reload(true), 400);
        }

        let isTranslationOpen = false;

        function toggleTranslation() {
            isTranslationOpen = !isTranslationOpen;
            const container = document.getElementById('translation-container');
            const icon = document.getElementById('accordion-icon');

            if (isTranslationOpen) {
                container.style.maxHeight = container.scrollHeight + "px";
                container.style.opacity = "1";
                icon.classList.add('rotate-180');
            } else {
                container.style.maxHeight = "0px";
                container.style.opacity = "0";
                icon.classList.remove('rotate-180');
            }
        }

        function shareCurrentDzikirItem() {
            if (!listBadaShalat || !listBadaShalat[currentIndex]) return;
            const item = listBadaShalat[currentIndex];

            const message = `📿 *${item.judul} (Dzikir Ba'da Shalat)*\n\n${item.arab}\n\n"${item.arti}"\n\n_Dibagikan dari Aplikasi Dzikir_\nhttps://dzikir-pagi-petang.kodelabo.com/`;

            if (navigator.share) {
                navigator.share({
                    title: item.judul,
                    text: message,
                    url: 'https://dzikir-pagi-petang.kodelabo.com/'
                }).catch(() => {});
            } else {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
                window.open(waUrl, '_blank');
            }
        }

        loadBadaShalatData();
    </script>
</body>
