<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <title>Dzikir Pagi & Petang - Dzikir Digital</title>
    
    <!-- Primary SEO Meta Tags -->

    <meta name="keywords" content="dzikir pagi, dzikir petang, dzikir sore, hisnul muslim, tasbih digital">

    <meta property="og:url" content="https://dzikir-pagi-petang.kodelabo.com/dzikir-pagi-petang.html">
    <meta property="og:title" content="Dzikir Pagi & Sore - Dzikir Hisnul Muslim">
    <meta property="og:description" content="Bacaan Dzikir Pagi & Petang Hisnul Muslim lengkap dengan teks Arab, terjemahan, dan tasbih digital.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2972/2972531.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">

            darkMode: 'class'

    <style>
        body {
            font-family: 'Inter', sans-serif;

        .arabic {
            font-family: 'Amiri', serif;

        [data-font="sm"] .arabic-content {

        [data-font="md"] .arabic-content {

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-20 transition-colors duration-200">

    <!-- Header App Bar -->
    <header class="bg-emerald-600 dark:bg-emerald-800 text-white p-3.5 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5">
                <a href="index.html" class="p-2 rounded-xl bg-emerald-700 dark:bg-emerald-900 hover:bg-emerald-800 border border-emerald-500/60 transition-all flex items-center justify-center text-white active:scale-95 shadow-sm" title="Kembali ke Beranda">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <div>
                    <h1 id="app-title" class="text-base font-extrabold leading-tight">Dzikir Pagi & Petang</h1>
                    <p class="text-[10px] text-emerald-100/90 font-medium">Hisnul Muslim</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="notify-btn" onclick="requestNotification()" title="Notifikasi"
                    class="bg-emerald-700/80 dark:bg-emerald-900 hover:bg-emerald-800 text-white p-2 rounded-xl border border-emerald-500/60 text-xs active:scale-95 transition-all">
                    🔔
                </button>
                <button id="theme-btn" onclick="ThemeManager.toggle()" title="Ganti Tema"
                    class="bg-emerald-700/80 dark:bg-emerald-900 hover:bg-emerald-800 active:scale-95 p-2 rounded-xl border border-emerald-500/60 transition-all flex items-center text-white">
                </button>
                <button onclick="refreshPage()" title="Refresh"
                    class="bg-emerald-700/80 dark:bg-emerald-900 hover:bg-emerald-800 active:scale-95 p-2 rounded-xl border border-emerald-500/60 transition-all flex items-center text-white">
                    <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none"
                        stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Segmented Tab Waktu (Pagi / Petang) -->
        <div class="max-w-md mx-auto mt-2.5 bg-emerald-800/80 dark:bg-emerald-950 p-1 rounded-xl flex gap-1 border border-emerald-700/60 shadow-inner">
            <button id="btn-mode-pagi" onclick="setMode('pagi')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-sm">
                <span>☀️</span> <span>Dzikir Pagi</span>
            </button>
            <button id="btn-mode-sore" onclick="setMode('sore')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-emerald-100 hover:text-white">
                <span>🌙</span> <span>Dzikir Petang</span>
            </button>
        </div>

        <div class="max-w-md mx-auto mt-2 bg-emerald-900/60 h-1.5 rounded-full overflow-hidden">
            <div id="progress-indicator" class="bg-amber-300 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 max-w-md mx-auto w-full">

        <div id="install-container" class="hidden w-full mb-4">
            <button onclick="installPWA()"
                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
                📲 Pasang Aplikasi di HP
            </button>
        </div>

        <!-- Controls: Font Size & Sound Toggle -->
        <div class="flex items-center justify-between w-full mb-3 gap-2">
            <div class="flex items-center gap-1.5">
                <button id="sound-btn" onclick="toggleSound()" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 text-xs font-semibold hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all flex items-center gap-1 active:scale-95 shadow-xs" title="Suara Ketukan">
                    <span id="sound-btn-icon">🔊</span> <span class="text-[10px]">Suara</span>
                </button>
            </div>

            <div class="flex items-center gap-1 text-xs font-bold">
                <span class="text-[10px] uppercase tracking-wider font-medium text-slate-400 mr-0.5 hidden sm:inline">Teks</span>
                <button id="font-sm" onclick="ThemeManager.setFont('sm')" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all">A-</button>
                <button id="font-md" onclick="ThemeManager.setFont('md')" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all">A</button>
                <button id="font-lg" onclick="ThemeManager.setFont('lg')" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition-all">A+</button>
            </div>
        </div>

        <!-- Main Card Dzikir -->
        <div id="dzikir-card" onclick="decrementCounter()"
            class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 w-full flex flex-col gap-5 cursor-pointer active:scale-[0.99] transition-all select-none">

            <h2 id="judul-dzikir" class="text-emerald-600 dark:text-emerald-400 font-bold text-xs uppercase tracking-wide"></h2>

            <div id="arabic-text" class="arabic arabic-content text-right text-slate-900 dark:text-slate-100"></div>

            <!-- Accordion Terjemahan & Share -->
            <div class="border-t border-slate-100 dark:border-slate-800 pt-4 flex gap-2 items-center" onclick="event.stopPropagation()">
                <button onclick="toggleTranslation()"
                    class="flex-grow flex justify-between items-center bg-slate-50 dark:bg-slate-800/60 hover:bg-emerald-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs transition-all py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700/60">
                    <span>Tampilkan Terjemahan</span>
                    <svg id="accordion-icon" class="w-4 h-4 transform transition-transform duration-300 text-slate-400"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <button onclick="shareCurrentDzikirItem()" title="Bagikan ke WhatsApp"
                    class="bg-slate-50 dark:bg-slate-800/60 hover:bg-emerald-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/60 text-xs flex items-center justify-center transition-all active:scale-95">
                    📲
                </button>
            </div>

            <div id="translation-container"
                class="mt-1 text-slate-600 dark:text-slate-300 text-xs leading-relaxed overflow-hidden transition-all duration-300 max-h-0 opacity-0">
                <p id="translation-text" class="pt-1 px-1"></p>
            </div>

            <!-- Tasbih Digital Circular Ring Counter -->
            <div class="flex justify-center items-center mt-2">
                <div class="relative w-36 h-36 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 128 128">
                        <circle cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent"
                            class="text-slate-100 dark:text-slate-800" />
                        <circle id="counter-ring" cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8"
                            fill="transparent" stroke-dasharray="364.4" stroke-dashoffset="0" stroke-linecap="round"
                            class="text-emerald-500 dark:text-emerald-400 transition-all duration-200" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center text-center">
                        <span id="counter-number" class="text-4xl font-extrabold text-slate-900 dark:text-slate-100">0</span>
                        <span id="counter-target" class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Dibaca 1x</span>
                    </div>
                </div>
            </div>

            <p class="text-center text-[10px] text-slate-400 dark:text-slate-500 font-medium">Ketuk area mana saja untuk menghitung</p>
        </div>

        <!-- Controller Navigation -->
        <div class="flex justify-between items-center w-full mt-4 gap-3">
            <button onclick="prevDzikir()"
                class="flex-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3.5 px-4 rounded-xl text-xs active:scale-95 transition-all text-center">
                ← Sebelumnya
            </button>
            <button onclick="nextDzikir()"
                class="flex-1 bg-emerald-600 dark:bg-emerald-700 hover:bg-emerald-700 dark:hover:bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-xl text-xs shadow-md active:scale-95 transition-all text-center">
                Selanjutnya →
            </button>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-400 dark:text-slate-500 text-xs">
        <p class="font-medium">Aplikasi Dzikir Digital Pocket Book</p>
        <p class="mt-1 opacity-60 italic">Berdasarkan Al-Qur'an dan Sunnah Rasulullah ﷺ</p>
        <p class="mt-3 text-[10px] tracking-wide opacity-50">© 2026 Dzikir. By Abu Ayumi.</p>
    </footer>

    <script>
        let dataDzikir = { pagi: [], sore: [] };
        let currentMode = 'pagi';
        let currentIndex = 0;
        let currentCount = 0;
        let deferredPrompt;

        // Mendeteksi query parameter URL (?mode=pagi atau ?mode=sore)
        function checkUrlMode() {
            const params = new URLSearchParams(window.location.search);
            const modeParam = params.get('mode');
            if (modeParam === 'sore' || modeParam === 'pagi') {
                return modeParam;
            }
            // Otomatisasi Waktu: Jam 04:00 - 14:59 = Pagi, Sisanya = Sore
            const hour = new Date().getHours();
            return (hour >= 4 && hour < 15) ? 'pagi' : 'sore';
        }

        async function loadData() {
            try {
                const response = await fetch('dzikr.json');
                dataDzikir = await response.json();
                currentMode = checkUrlMode();
                setMode(currentMode);
            } catch (error) {
                console.error("Gagal memuat data dzikir:", error);
            }
        }

        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            currentCount = 0;

            const btnPagi = document.getElementById('btn-mode-pagi');
            const btnSore = document.getElementById('btn-mode-sore');

            if (mode === 'pagi') {
                btnPagi.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-sm";
                btnSore.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-emerald-100 hover:text-white";
            } else {
                btnSore.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-white text-emerald-800 shadow-sm";
                btnPagi.className = "flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 text-emerald-100 hover:text-white";
            }

            updateUI();
        }

        function updateUI() {
            const list = dataDzikir[currentMode];
            if (!list || list.length === 0) return;

            const item = list[currentIndex];
            document.getElementById('judul-dzikir').innerText = item.judul;
            document.getElementById('arabic-text').innerText = item.arab;
            document.getElementById('translation-text').innerText = item.arti;

            const target = item.ulang || 1;
            if (currentCount === 0) currentCount = target;

            document.getElementById('counter-number').innerText = currentCount;
            document.getElementById('counter-target').innerText = "Target: " + target + "x";

            updateRing(currentCount, target);

            // Progress bar halaman
            const progressPercent = ((currentIndex + 1) / list.length) * 100;
            document.getElementById('progress-indicator').style.width = progressPercent + "%";
        }

        function updateRing(c, t) {
            const ring = document.getElementById('counter-ring');
            ring.style.strokeDashoffset = 364.4 - (c / t) * 364.4;
        }

        function decrementCounter() {
            if (currentCount > 0) {
                currentCount--;
                if (window.SoundManager) {
                    SoundManager.playClickSound();
                }

                if (currentCount === 0) {
                    if (window.SoundManager) SoundManager.playCompletionSound();
                    setTimeout(nextDzikir, 300);
                }
            }
            updateUI();
        }

        function nextDzikir() {
            const list = dataDzikir[currentMode];
            if (currentIndex < list.length - 1) {
                currentIndex++;
                currentCount = 0;
                updateUI();
                window.scrollTo(0, 0);
            } else {
                if (window.TrackerManager) TrackerManager.markComplete(currentMode === 'pagi' ? 'pagi' : 'sore');
                const displayName = window.UserManager ? window.UserManager.getDisplayName() : 'Sahabat Dzikir';
                const modeLabel = currentMode === 'pagi' ? 'Dzikir Pagi' : 'Dzikir Petang';
                const emoji = currentMode === 'pagi' ? '🌅' : '🌙';

                if (window.UIHelper) {
                    UIHelper.showCompletionModal(
                        `Alhamdulillah, ${displayName}! ${emoji}`,
                        `Bacaan <b>${modeLabel}</b> kamu hari ini telah tuntas. Semoga Allah menjagamu & mencurahkan kedamaian dalam hidupmu. ❤️`,
                        emoji,
                        () => {
                            currentIndex = 0;
                            currentCount = 0;
                            updateUI();
                        }
                    );
                } else {
                    alert(`Alhamdulillah, ${modeLabel} selesai!`);
                    currentIndex = 0;
                    currentCount = 0;
                    updateUI();
                }
            }
        }

        function prevDzikir() {
            if (currentIndex > 0) {
                currentIndex--;
                currentCount = 0;
                updateUI();
            }
        }

        function refreshPage() {
            const icon = document.getElementById('refresh-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => window.location.reload(true), 400);
        }

        let isTranslationOpen = false;

        function toggleTranslation() {
            isTranslationOpen = !isTranslationOpen;
            const container = document.getElementById('translation-container');
            const icon = document.getElementById('accordion-icon');

            if (isTranslationOpen) {
                container.style.maxHeight = container.scrollHeight + "px";
                container.style.opacity = "1";
                icon.classList.add('rotate-180');
            } else {
                container.style.maxHeight = "0px";
                container.style.opacity = "0";
                icon.classList.remove('rotate-180');
            }
        }

        function shareCurrentDzikirItem() {
            const list = dataDzikir[currentMode];
            if (!list || !list[currentIndex]) return;
            const item = list[currentIndex];

            const message = `📿 *${item.judul} (Dzikir ${currentMode === 'pagi' ? 'Pagi' : 'Petang'})*\n\n${item.arab}\n\n"${item.arti}"\n\n_Dibagikan dari Aplikasi Dzikir_\nhttps://dzikir-pagi-petang.kodelabo.com/`;

            if (navigator.share) {
                navigator.share({
                    title: item.judul,
                    text: message,
                    url: 'https://dzikir-pagi-petang.kodelabo.com/'
                }).catch(() => {});
            } else {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
                window.open(waUrl, '_blank');
            }
        }

        // --- FITUR PWA & NOTIFIKASI ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    });
                });
            });
        }

        function requestNotification() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification("Dzikir", {
                            body: "Notifikasi berhasil diaktifkan!"
                        });
                    });
                }
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-container').classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('install-container').classList.add('hidden');
            deferredPrompt = null;
        }

        function syncSoundBtn() {
            if (!window.SoundManager) return;
            const soundIcon = document.getElementById('sound-btn-icon');
            const soundBtn = document.getElementById('sound-btn');
            const sOn = SoundManager.isSoundEnabled();

            if (soundIcon) soundIcon.innerText = sOn ? "🔊" : "🔇";
            if (soundBtn) soundBtn.className = sOn 
                ? "px-2.5 py-1 rounded-lg border border-emerald-500 bg-emerald-50 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 text-xs font-semibold hover:bg-emerald-100 transition-all flex items-center gap-1 active:scale-95 shadow-xs"
                : "px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-400 dark:text-slate-500 text-xs font-semibold transition-all flex items-center gap-1 active:scale-95 shadow-xs opacity-75";
        }

        function toggleSound() {
            if (!window.SoundManager) return;
            const cur = SoundManager.isSoundEnabled();
            SoundManager.setSoundEnabled(!cur);
            syncSoundBtn();
            if (!cur) SoundManager.playClickSound();
            if (window.UIHelper) UIHelper.showToast(!cur ? "Suara ketukan aktif 🔊" : "Suara ketukan dimatikan 🔇", "🔊");
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncSoundBtn();
        });

        // Mulai Ambil Data
        loadData();
    </script>
</body>

</html>
